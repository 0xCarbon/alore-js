      required:
        - role
        - content
        - tool_call_id
    ChatCompletionRequestToolMessageContentPart:
      oneOf:
        - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
    ChatCompletionRequestUserMessage:
      type: object
      title: User message
      description: |
        Messages sent by an end user, containing prompts or additional context
        information.
      properties:
        content:
          description: |
            The contents of the user message.
          oneOf:
            - type: string
              description: The text contents of the message.
              title: Text content
            - type: array
              description: An array of content parts with a defined type. Supported options differ based on the [model](https://developers.openai.com/api/docs/models) being used to generate the response. Can contain text, image, or audio inputs.
              title: Array of content parts
              items:
                $ref: "#/components/schemas/ChatCompletionRequestUserMessageContentPart"
              minItems: 1
        role:
          type: string
          const: user
          description: The role of the messages author, in this case `user`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
      required:
        - content
        - role
    ChatCompletionRequestUserMessageContentPart:
      oneOf:
        - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
        - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartImage"
        - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartAudio"
        - $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartFile"
    ChatCompletionResponseMessage:
      type: object
      description: A chat completion message generated by the model.
      properties:
        content:
          anyOf:
            - type: string
              description: The contents of the message.
            - type: "null"
        refusal:
          anyOf:
            - type: string
              description: The refusal message generated by the model.
            - type: "null"
        tool_calls:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionMessageToolCalls"
            - type: "null"
        annotations:
          type: array
          description: |
            Annotations for the message, when applicable, as when using the
            [web search tool](https://developers.openai.com/api/docs/guides/tools-web-search).
          items:
            type: object
            description: |
              A URL citation when using web search.
            required:
              - type
              - url_citation
            properties:
              type:
                type: string
                description: The type of the URL citation. Always `url_citation`.
                const: url_citation
              url_citation:
                type: object
                description: A URL citation when using web search.
                required:
                  - end_index
                  - start_index
                  - url
                  - title
                properties:
                  end_index:
                    type: integer
                    description: The index of the last character of the URL citation in the message.
                  start_index:
                    type: integer
                    description: The index of the first character of the URL citation in the message.
                  url:
                    type: string
                    format: uri
                    description: The URL of the web resource.
                  title:
                    type: string
                    description: The title of the web resource.
        role:
          type: string
          const: assistant
          description: The role of the author of this message.
        function_call:
          type:
            - object
            - "null"
          deprecated: true
          description: Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be called, as generated by the model.
          properties:
            arguments:
              type: string
              description: The arguments to call the function with, as generated by the model in JSON format. Note that the model does not always generate valid JSON, and may hallucinate parameters not defined by your function schema. Validate the arguments in your code before calling your function.
            name:
              type: string
              description: The name of the function to call.
          required:
            - name
            - arguments
        audio:
          anyOf:
            - type: object
              description: |
                If the audio output modality is requested, this object contains data
                about the audio response from the model. [Learn more](https://developers.openai.com/api/docs/guides/audio).
              required:
                - id
                - expires_at
                - data
                - transcript
              properties:
                id:
                  type: string
                  description: Unique identifier for this audio response.
                expires_at:
                  type: integer
                  format: unixtime
                  description: |
                    The Unix timestamp (in seconds) for when this audio response will
                    no longer be accessible on the server for use in multi-turn
                    conversations.
                data:
                  type: string
                  description: |
                    Base64 encoded audio bytes generated by the model, in the format
                    specified in the request.
                transcript:
                  type: string
                  description: Transcript of the audio generated by the model.
            - type: "null"
      required:
        - role
        - content
    ChatCompletionStreamOptions:
      anyOf:
        - description: |
            Options for streaming response. Only set this when you set `stream: true`.
          type: object
          properties:
            include_usage:
              type: boolean
              description: |
                If set, an additional chunk will be streamed before the `data: [DONE]`
                message. The `usage` field on this chunk shows the token usage statistics
                for the entire request, and the `choices` field will always be an empty
                array.

                All other chunks will also include a `usage` field, but with a null
                value. **NOTE:** If the stream is interrupted, you may not receive the
                final usage chunk which contains the total token usage for the request.
            include_obfuscation:
              type: boolean
              description: |
                When true, stream obfuscation will be enabled. Stream obfuscation adds
                random characters to an `obfuscation` field on streaming delta events to
                normalize payload sizes as a mitigation to certain side-channel attacks.
                These obfuscation fields are included by default, but add a small amount
                of overhead to the data stream. You can set `include_obfuscation` to
                false to optimize for bandwidth if you trust the network links between
                your application and the OpenAI API.
        - type: "null"
    ChatCompletionStreamResponseDelta:
      type: object
      description: |
        A chat completion delta generated by streamed model responses.
        Streamed audio can arrive in partial updates with an ID, base64 data, or
        transcript text. The final audio update contains only its expiry timestamp.
      properties:
        audio:
          type: object
          description: |
            A partial audio response. Audio chunks may carry an ID, base64 data, or
            transcript text; the final audio update contains only its expiry timestamp.
          properties:
            id:
              type: string
              description: Unique identifier for this audio response.
            expires_at:
              type: integer
              format: unixtime
              description: |
                The Unix timestamp (in seconds) for when this audio response will no
                longer be accessible on the server for use in multi-turn conversations.
            data:
              type: string
              description: |
                Base64 encoded audio bytes generated by the model, in the format
                specified in the request.
            transcript:
              type: string
              description: Transcript text from this audio chunk.
        content:
          anyOf:
            - type: string
              description: The contents of the chunk message.
            - type: "null"
        function_call:
          deprecated: true
          type: object
          description: Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be called, as generated by the model.
          properties:
            arguments:
              type: string
              description: The arguments to call the function with, as generated by the model in JSON format. Note that the model does not always generate valid JSON, and may hallucinate parameters not defined by your function schema. Validate the arguments in your code before calling your function.
            name:
              type: string
              description: The name of the function to call.
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionMessageToolCallChunk"
        role:
          type: string
          enum:
            - developer
            - system
            - user
            - assistant
            - tool
          description: The role of the author of this message.
        refusal:
          anyOf:
            - type: string
              description: The refusal message generated by the model.
            - type: "null"
    ChatCompletionTokenLogprob:
      type: object
      properties:
        token:
          description: The token.
          type: string
        logprob:
          description: The log probability of this token, if it is within the top 20 most likely tokens. Otherwise, the value `-9999.0` is used to signify that the token is very unlikely.
          type: number
        bytes:
          anyOf:
            - description: A list of integers representing the UTF-8 bytes representation of the token. Useful in instances where characters are represented by multiple tokens and their byte representations must be combined to generate the correct text representation. Can be `null` if there is no bytes representation for the token.
              type: array
              items:
                type: integer
            - type: "null"
        top_logprobs:
          description: List of the most likely tokens and their log probability, at this token position. The number of entries may be fewer than the requested `top_logprobs`.
          type: array
          items:
            type: object
            properties:
              token:
                description: The token.
                type: string
              logprob:
                description: The log probability of this token, if it is within the top 20 most likely tokens. Otherwise, the value `-9999.0` is used to signify that the token is very unlikely.
                type: number
              bytes:
                anyOf:
                  - description: A list of integers representing the UTF-8 bytes representation of the token. Useful in instances where characters are represented by multiple tokens and their byte representations must be combined to generate the correct text representation. Can be `null` if there is no bytes representation for the token.
                    type: array
                    items:
                      type: integer
                  - type: "null"
            required:
              - token
              - logprob
              - bytes
      required:
        - token
        - logprob
        - bytes
        - top_logprobs
    ChatCompletionTool:
      type: object
      title: Function tool
      description: |
        A function tool that can be used to generate a response.
      properties:
        type:
          type: string
          const: function
          description: The type of the tool. Currently, only `function` is supported.
        function:
          $ref: "#/components/schemas/FunctionObject"
      required:
        - type
        - function
    ChatCompletionToolChoiceOption:
      description: |
        Controls which (if any) tool is called by the model.
        `none` means the model will not call any tool and instead generates a message.
        `auto` means the model can pick between generating a message or calling one or more tools.
        `required` means the model must call one or more tools.
        Specifying a particular tool via `{"type": "function", "function": {"name": "my_function"}}` forces the model to call that tool.

        `none` is the default when no tools are present. `auto` is the default if tools are present.
      oneOf:
        - type: string
          title: Tool choice mode
          description: |
            `none` means the model will not call any tool and instead generates a message. `auto` means the model can pick between generating a message or calling one or more tools. `required` means the model must call one or more tools.
          enum:
            - none
            - auto
            - required
        - $ref: "#/components/schemas/ChatCompletionAllowedToolsChoice"
        - $ref: "#/components/schemas/ChatCompletionNamedToolChoice"
        - $ref: "#/components/schemas/ChatCompletionNamedToolChoiceCustom"
    ChunkingStrategyRequestParam:
      type: object
      description: The chunking strategy used to chunk the file(s). If not set, will use the `auto` strategy.
      oneOf:
        - $ref: "#/components/schemas/AutoChunkingStrategyRequestParam"
        - $ref: "#/components/schemas/StaticChunkingStrategyRequestParam"
      discriminator:
        propertyName: type
    CodeInterpreterTool:
      type: object
      title: Code interpreter
      description: |
        A tool that runs Python code to help generate a response to a prompt.
      properties:
        type:
          type: string
          enum:
            - code_interpreter
          description: |
            The type of the code interpreter tool. Always `code_interpreter`.
          x-stainless-const: true
        container:
          description: |
            The code interpreter container. Can be a container ID or an object that
            specifies uploaded file IDs to make available to your code, along with an
            optional `memory_limit` setting.
          oneOf:
            - type: string
              description: The container ID.
            - $ref: "#/components/schemas/AutoCodeInterpreterToolParam"
        allowed_callers:
          anyOf:
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/CallableToolAllowedCaller"
              description: The tool invocation context(s).
            - type: "null"
      required:
        - type
        - container
    CodeInterpreterToolCall:
      type: object
      title: Code interpreter tool call
      description: |
        A tool call to run code.
      properties:
        type:
          type: string
          enum:
            - code_interpreter_call
          default: code_interpreter_call
          x-stainless-const: true
          description: |
            The type of the code interpreter tool call. Always `code_interpreter_call`.
        id:
          type: string
          description: |
            The unique ID of the code interpreter tool call.
        status:
          type: string
          enum:
            - in_progress
            - completed
            - incomplete
            - interpreting
            - failed
          description: |
            The status of the code interpreter tool call. Valid values are `in_progress`, `completed`, `incomplete`, `interpreting`, and `failed`.
        container_id:
          type: string
          description: |
            The ID of the container used to run the code.
        code:
          anyOf:
            - type: string
              description: |
                The code to run, or null if not available.
            - type: "null"
        outputs:
          anyOf:
            - type: array
              items:
                oneOf:
                  - $ref: "#/components/schemas/CodeInterpreterOutputLogs"
                  - $ref: "#/components/schemas/CodeInterpreterOutputImage"
                discriminator:
                  propertyName: type
              discriminator:
                propertyName: type
              description: |
                The outputs generated by the code interpreter, such as logs or images.
                Can be null if no outputs are available.
            - type: "null"
      required:
        - type
        - id
        - status
        - container_id
        - code
        - outputs
    ComparisonFilter:
      type: object
      additionalProperties: false
      title: Comparison Filter
      description: |
        A filter used to compare a specified attribute key to a given value using a defined comparison operation.
      properties:
        type:
          type: string
          default: eq
          enum:
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
            - in
            - nin
          description: |
            Specifies the comparison operator: `eq`, `ne`, `gt`, `gte`, `lt`, `lte`, `in`, `nin`.
            - `eq`: equals
            - `ne`: not equal
            - `gt`: greater than
            - `gte`: greater than or equal
            - `lt`: less than
            - `lte`: less than or equal
            - `in`: in
            - `nin`: not in
        key:
          type: string
          description: The key to compare against the value.
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
          description: The value to compare against the attribute key; supports string, number, or boolean types.
      required:
        - type
        - key
        - value
    CompleteUploadRequest:
