                      description: |
                        A list of [file](https://developers.openai.com/api/reference/resources/files) IDs made available to the `code_interpreter` tool. There can be a maximum of 20 files associated with the tool.
                      default: []
                      maxItems: 20
                      items:
                        type: string
                file_search:
                  type: object
                  properties:
                    vector_store_ids:
                      type: array
                      description: |
                        The [vector store](https://developers.openai.com/api/reference/resources/vector_stores) attached to this thread. There can be a maximum of 1 vector store attached to the thread.
                      maxItems: 1
                      items:
                        type: string
            - type: "null"
        metadata:
          $ref: "#/components/schemas/Metadata"
    OpenAIFile:
      title: OpenAIFile
      description: The `File` object represents a document that has been uploaded to OpenAI.
      properties:
        id:
          type: string
          description: The file identifier, which can be referenced in the API endpoints.
        bytes:
          type:
            - integer
            - "null"
          description: |
            The size of the file, in bytes. In a completed file upload response, this can
            be null when the file size is not yet available.
        created_at:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) for when the file was created.
        expires_at:
          type: integer
          format: unixtime
          description: |
            The Unix timestamp (in seconds) for when the file will expire. In a
            completed file upload response, this can be null when no expiry is set.
        filename:
          type: string
          description: The name of the file.
        object:
          type: string
          description: The object type, which is always `file`.
          const: file
        purpose:
          type: string
          description: The intended purpose of the file. Supported values are `assistants`, `assistants_output`, `batch`, `batch_output`, `fine-tune`, `fine-tune-results`, `vision`, and `user_data`.
          enum:
            - assistants
            - assistants_output
            - batch
            - batch_output
            - fine-tune
            - fine-tune-results
            - vision
            - user_data
        status:
          type: string
          deprecated: true
          description: Deprecated. The current status of the file, which can be either `uploaded`, `processed`, or `error`.
          enum:
            - uploaded
            - processed
            - error
        status_details:
          type: string
          deprecated: true
          description: Deprecated. For details on why a fine-tuning training file failed validation, see the `error` field on `fine_tuning.job`. Completed file upload responses can return null when these details are unset.
        x_alore:
          $ref: "#/components/schemas/AloreFileExtension"
          x-alore-feature: files.status
          x-status: planned
      required:
        - id
        - object
        - bytes
        - created_at
        - filename
        - purpose
        - status
    OtherChunkingStrategyResponseParam:
      type: object
      title: Other Chunking Strategy
      description: This is returned when the chunking strategy is unknown. Typically, this is because the file was indexed before the `chunking_strategy` concept was introduced in the API.
      additionalProperties: false
      properties:
        type:
          type: string
          description: Always `other`.
          const: other
      required:
        - type
    OutputContent:
      oneOf:
        - $ref: "#/components/schemas/OutputTextContent"
        - $ref: "#/components/schemas/RefusalContent"
        - $ref: "#/components/schemas/ReasoningTextContent"
      discriminator:
        propertyName: type
    OutputItem:
      oneOf:
        - $ref: "#/components/schemas/OutputMessage"
        - $ref: "#/components/schemas/FileSearchToolCall"
        - $ref: "#/components/schemas/FunctionToolCall"
        - $ref: "#/components/schemas/FunctionToolCallOutputResource"
        - $ref: "#/components/schemas/WebSearchToolCall"
        - $ref: "#/components/schemas/ComputerToolCall"
        - $ref: "#/components/schemas/ComputerToolCallOutputResource"
        - $ref: "#/components/schemas/ReasoningItem"
        - $ref: "#/components/schemas/Program"
        - $ref: "#/components/schemas/ProgramOutput"
        - $ref: "#/components/schemas/ToolSearchCall"
        - $ref: "#/components/schemas/ToolSearchOutput"
        - $ref: "#/components/schemas/AdditionalTools"
        - $ref: "#/components/schemas/CompactionBody"
        - $ref: "#/components/schemas/ImageGenToolCall"
        - $ref: "#/components/schemas/CodeInterpreterToolCall"
        - $ref: "#/components/schemas/LocalShellToolCall"
        - $ref: "#/components/schemas/LocalShellToolCallOutput"
        - $ref: "#/components/schemas/FunctionShellCall"
        - $ref: "#/components/schemas/FunctionShellCallOutput"
        - $ref: "#/components/schemas/ApplyPatchToolCall"
        - $ref: "#/components/schemas/ApplyPatchToolCallOutput"
        - $ref: "#/components/schemas/MCPToolCall"
        - $ref: "#/components/schemas/MCPListTools"
        - $ref: "#/components/schemas/MCPApprovalRequest"
        - $ref: "#/components/schemas/MCPApprovalResponseResource"
        - $ref: "#/components/schemas/CustomToolCall"
        - $ref: "#/components/schemas/CustomToolCallOutputResource"
      discriminator:
        propertyName: type
    OutputMessage:
      type: object
      title: Output message
      description: |
        An output message from the model.
      properties:
        id:
          type: string
          description: |
            The unique ID of the output message.
        type:
          type: string
          description: |
            The type of the output message. Always `message`.
          const: message
        role:
          type: string
          description: |
            The role of the output message. Always `assistant`.
          const: assistant
        content:
          type: array
          description: |
            The content of the output message.
          items:
            $ref: "#/components/schemas/OutputMessageContent"
        phase:
          anyOf:
            - $ref: "#/components/schemas/MessagePhase"
            - type: "null"
        status:
          type: string
          description: |
            The status of the message input. One of `in_progress`, `completed`, or
            `incomplete`. Populated when input items are returned via API.
          enum:
            - in_progress
            - completed
            - incomplete
      required:
        - id
        - type
        - role
        - content
        - status
    OutputMessageContent:
      oneOf:
        - $ref: "#/components/schemas/OutputTextContent"
        - $ref: "#/components/schemas/RefusalContent"
      discriminator:
        propertyName: type
    ParallelToolCalls:
      description: Whether to enable [parallel function calling](https://developers.openai.com/api/docs/guides/function-calling#parallel-function-calling) during tool use.
      type: boolean
      default: true
    PartialImages:
      anyOf:
        - type: integer
          maximum: 3
          minimum: 0
          default: 0
          example: 1
          description: |
            The number of partial images to generate. This parameter is used for
            streaming responses that return partial images. Value must be between 0 and 3.
            When set to 0, the response will be a single image sent in one streaming event.

            Note that the final image may be sent before the full number of partial images
            are generated if the full image is generated more quickly.
        - type: "null"
    PermissionErrorResponse:
      type: object
      properties:
        error:
          description: Details about the permission error.
          anyOf:
            - $ref: "#/components/schemas/Error"
            - type: string
              description: An explanation of the missing API permissions.
      required:
        - error
    PredictionContent:
      type: object
      title: Static Content
      description: |
        Static predicted output content, such as the content of a text file that is
        being regenerated.
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum:
            - content
          description: |
            The type of the predicted content you want to provide. This type is
            currently always `content`.
          x-stainless-const: true
        content:
          description: |
            The content that should be matched when generating a model response.
            If generated tokens would match this content, the entire model response
            can be returned much more quickly.
          oneOf:
            - type: string
              title: Text content
              description: |
                The content used for a Predicted Output. This is often the
                text of a file you are regenerating with minor changes.
            - type: array
              description: An array of content parts with a defined type. Supported options differ based on the [model](https://developers.openai.com/api/docs/models) being used to generate the response. Can contain text inputs.
              title: Array of content parts
              items:
                $ref: "#/components/schemas/ChatCompletionRequestMessageContentPartText"
              minItems: 1
    Prompt:
      anyOf:
        - type: object
          description: |
            Reference to a prompt template and its variables.
            [Learn more](https://developers.openai.com/api/docs/guides/text?api-mode=responses#version-prompts-in-code).
          required:
            - id
          properties:
            id:
              type: string
              description: The unique identifier of the prompt template to use.
            version:
              anyOf:
                - type: string
                  description: Optional version of the prompt template.
                - type: "null"
            variables:
              $ref: "#/components/schemas/ResponsePromptVariables"
        - type: "null"
    Reasoning:
      type: object
      description: |
        Configuration options for
        [reasoning models](https://developers.openai.com/api/docs/guides/reasoning).
      title: Reasoning
      properties:
        mode:
          $ref: "#/components/schemas/ReasoningModeEnum"
          description: |
            Controls the reasoning execution mode for the request.

            When returned on a response, this is the effective execution mode.
        effort:
          $ref: "#/components/schemas/ReasoningEffort"
        summary:
          anyOf:
            - type: string
              description: |
                A summary of the reasoning performed by the model. This can be
                useful for debugging and understanding the model's reasoning process.
                One of `auto`, `concise`, or `detailed`.

                `concise` is supported for `computer-use-preview` models and all reasoning models after `gpt-5`.
              enum:
                - auto
                - concise
                - detailed
            - type: "null"
        context:
          anyOf:
            - type: string
              description: |
                Controls which reasoning items are rendered back to the model on later turns.
                If omitted or set to `auto`, the model determines the context mode. The
                `gpt-5.6` model family defaults to `all_turns`; earlier models default to
                `current_turn`.

                When returned on a response, this is the effective reasoning context mode
                used for the response.
              enum:
                - auto
                - current_turn
                - all_turns
            - type: "null"
        generate_summary:
          anyOf:
            - type: string
              deprecated: true
              description: |
                **Deprecated:** use `summary` instead.

                A summary of the reasoning performed by the model. This can be
                useful for debugging and understanding the model's reasoning process.
                One of `auto`, `concise`, or `detailed`.
              enum:
                - auto
                - concise
                - detailed
            - type: "null"
    ReasoningEffort:
      anyOf:
        - type: string
          enum:
            - none
            - minimal
            - low
            - medium
            - high
            - xhigh
            - max
          default: medium
          description: |
            Constrains effort on reasoning for reasoning models. Currently supported
            values are `none`, `minimal`, `low`, `medium`, `high`, `xhigh`, and `max`.
            Reducing reasoning effort can result in faster responses and fewer tokens
            used on reasoning in a response. Not all reasoning models support every
            value. See the
            [reasoning guide](https://developers.openai.com/api/docs/guides/reasoning)
            for model-specific support.
        - type: "null"
    ReasoningItem:
      type: object
      description: |
        A description of the chain of thought used by a reasoning model while generating
        a response. Be sure to include these items in your `input` to the Responses API
        for subsequent turns of a conversation if you are manually
        [managing context](https://developers.openai.com/api/docs/guides/conversation-state).
      title: Reasoning
      properties:
        type:
          type: string
          description: |
            The type of the object. Always `reasoning`.
          enum:
            - reasoning
          x-stainless-const: true
        id:
          type: string
          description: |
            The unique identifier of the reasoning content.
        encrypted_content:
          anyOf:
            - type: string
              description: |
                The encrypted content of the reasoning item. This is populated by default
                for reasoning items returned by `POST /v1/responses` and WebSocket
                `response.create` requests.

                When streaming, use the completed reasoning item and its
                `encrypted_content` from the `response.output_item.done` event in
                subsequent requests. The `encrypted_content` in
                `response.output_item.added` may be incomplete. This is especially
                important when `store` is `false` or when using Zero Data Retention.
            - type: "null"
        summary:
          type: array
          description: |
            Reasoning summary content.
          items:
            $ref: "#/components/schemas/SummaryTextContent"
        content:
          type: array
          description: |
            Reasoning text content.
          items:
            $ref: "#/components/schemas/ReasoningTextContent"
        status:
          type: string
          description: |
            The status of the item. One of `in_progress`, `completed`, or
            `incomplete`. Populated when items are returned via API.
          enum:
            - in_progress
            - completed
            - incomplete
      required:
        - id
        - summary
        - type
    Response:
      title: The response object
      allOf:
        - $ref: "#/components/schemas/ModelResponseProperties"
        - $ref: "#/components/schemas/ResponseProperties"
        - type: object
          properties:
            image:
              $ref: "#/components/schemas/ResolvedImageOptions"
            service_tier:
              $ref: "#/components/schemas/ServiceTierResponses"
            truncation:
              anyOf:
                - type: string
                  description: |
                    The truncation strategy to use for the model response.
                    - `auto`: If the input to this Response exceeds
                      the model's context window size, the model will truncate the
                      response to fit the context window by dropping items from the beginning of the conversation.
                      On some models, trimming can begin earlier because the API subtracts the model's
                      maximum output allowance from its input limit, even if you set a lower `max_output_tokens`.
                    - `disabled` (default): If the input size will exceed the context window
                      size for a model, the request will fail with a 400 error.
                  enum:
                    - auto
                    - disabled
                  default: disabled
                - type: "null"
            id:
              type: string
              description: |
                Unique identifier for this Response.
            object:
              type: string
              description: |
                The object type of this resource - always set to `response`.
              const: response
            status:
              type: string
              description: |
                The status of the response generation. One of `completed`, `failed`,
                `in_progress`, `cancelled`, `queued`, or `incomplete`.
              enum:
                - completed
                - failed
                - in_progress
                - cancelled
                - queued
                - incomplete
            access_programs:
              anyOf:
                - $ref: "#/components/schemas/AccessProgramsBody"
                - type: "null"
            created_at:
              type: number
              format: unixtime
              description: |
                Unix timestamp (in seconds) of when this Response was created.
            completed_at:
              anyOf:
                - type: number
                  format: unixtime
                  description: |
                    Unix timestamp (in seconds) of when this Response was completed.
                    Only present when the status is `completed`.
                - type: "null"
            error:
              $ref: "#/components/schemas/ResponseError"
            incomplete_details:
              anyOf:
                - type: object
                  description: |
                    Details about why the response is incomplete.
                  properties:
                    reason:
                      type: string
                      description: |
                        The reason why the response is incomplete. `steered` means
                        the response stopped at a safe output boundary after a
                        WebSocket `response.steer` event. The server can then create
                        a successor response automatically with the queued input.
                      enum:
                        - max_output_tokens
                        - max_messages
                        - content_filter
                        - steered
                - type: "null"
            input_transformations:
              type: array
              description: Reasoning inputs withheld from the model, in input order.
              items:
                $ref: "#/components/schemas/ReasoningInputTransformation"
            output:
              type: array
              description: |
                An array of content items generated by the model.

                - The length and order of items in the `output` array is dependent
                  on the model's response.
                - Rather than accessing the first item in the `output` array and
                  assuming it's an `assistant` message with the content generated by
                  the model, you might consider using the `output_text` property where
                  supported in SDKs.
              items:
                $ref: "#/components/schemas/OutputItem"
            reasoning:
              anyOf:
                - $ref: "#/components/schemas/Reasoning"
                - type: "null"
            instructions:
              anyOf:
                - description: |
                    A system (or developer) message inserted into the model's context.

                    When using along with `previous_response_id`, the instructions from a previous
                    response will not be carried over to the next response. This makes it simple
                    to swap out system (or developer) messages in new responses.
                  oneOf:
                    - type: string
                      description: |
                        A text input to the model, equivalent to a text input with the
                        `developer` role.
                    - type: array
                      title: Input item list
                      description: |
                        A list of one or many input items to the model, containing
                        different content types.
                      items:
                        $ref: "#/components/schemas/InputItem"
                - type: "null"
            output_text:
              anyOf:
                - type: string
                  description: |
                    SDK-only convenience property that contains the aggregated text output
                    from all `output_text` items in the `output` array, if any are present.
                    Supported in the Python and JavaScript SDKs.
                  x-oaiSupportedSDKs:
                    - python
                    - javascript
                - type: "null"
            usage:
              anyOf:
                - $ref: "#/components/schemas/ResponseUsage"
                - type: "null"
            tool_usage:
              $ref: "#/components/schemas/ResponseToolUsage"
              description: |
                Usage reported by hosted tools, separate from base model `usage`. The field
                can be omitted when tool usage is unavailable. When present, tool families
                with no recorded usage have zero counts.

                `image_gen` sums available token counts across image generation calls.
                Calls with missing or incomplete usage records may be skipped. Output
                token details and cached input counts can be omitted. An omitted cache
                count means cache usage is unknown.

                `web_search.num_requests` counts billable searches. Discounted searches
                and actions such as opening a page are excluded. Use billing records to
                reconcile final charges.
            prompt_cache_options:
              $ref: "#/components/schemas/PromptCacheOptions"
            prompt_cache_diagnostics:
              $ref: "#/components/schemas/PromptCacheDiagnostics"
            moderation:
              anyOf:
                - $ref: "#/components/schemas/Moderation"
                  description: |
                    Moderation results for the response input and output, if moderated completions were requested.
                - type: "null"
            parallel_tool_calls:
              type: boolean
              description: |
                Whether to allow the model to run tool calls in parallel.
              default: true
            conversation:
              anyOf:
                - default: null
                  $ref: "#/components/schemas/ResponseConversation"
                - type: "null"
            max_output_tokens:
              anyOf:
                - description: |
                    An upper bound for the number of tokens that can be generated for a response, including visible output tokens and [reasoning tokens](https://developers.openai.com/api/docs/guides/reasoning).
                  type: integer
                - type: "null"
          required:
            - access_programs
            - id
            - object
            - created_at
            - error
            - incomplete_details
            - instructions
            - model
            - tools
            - output
            - parallel_tool_calls
            - metadata
            - tool_choice
            - temperature
            - top_p
      example:
        id: resp_67ccd3a9da748190baa7f1570fe91ac604becb25c45c1d41
        object: response
        access_programs: null
        created_at: 1741476777
        status: completed
        completed_at: 1741476778
        error: null
        incomplete_details: null
        instructions: null
        max_output_tokens: null
        model: gpt-6.2-astra
        output:
          - type: message
            id: msg_67ccd3acc8d48190a77525dc6de64b4104becb25c45c1d41
            status: completed
            role: assistant
            content:
              - type: output_text
                text: The image depicts a scenic landscape with a wooden boardwalk or pathway leading through lush, green grass under a blue sky with some clouds. The setting suggests a peaceful natural area, possibly a park or nature reserve. There are trees and shrubs in the background.
                annotations: []
                logprobs: []
        parallel_tool_calls: true
        previous_response_id: null
        reasoning:
          effort: null
          summary: null
          context: null
        store: true
        temperature: 1
        text:
          format:
            type: text
        tool_choice: auto
        tools: []
        top_p: 1
        truncation: disabled
        usage:
          input_tokens: 328
          input_tokens_details:
            cached_tokens: 0
            cache_write_tokens: 0
          output_tokens: 52
          output_tokens_details:
            reasoning_tokens: 0
          total_tokens: 380
        tool_usage:
          image_gen:
            input_tokens: 0
            input_tokens_details:
              text_tokens: 0
              image_tokens: 0
            output_tokens: 0
            output_tokens_details:
              text_tokens: 0
              image_tokens: 0
            total_tokens: 0
          web_search:
            num_requests: 0
        user: null
        metadata: {}
    ResponseAudioDeltaEvent:
      type: object
      description: Emitted when there is a partial audio response.
      properties:
        type:
          type: string
          description: |
            The type of the event. Always `response.audio.delta`.
          const: response.audio.delta
        sequence_number:
          type: integer
          description: |
            A sequence number for this chunk of the stream response.
        delta:
          type: string
          description: |
            A chunk of Base64 encoded response audio bytes.
      required:
        - type
        - delta
        - sequence_number
    ResponseAudioDoneEvent:
      type: object
      description: Emitted when the audio response is complete.
      properties:
        type:
          type: string
          description: |
            The type of the event. Always `response.audio.done`.
          const: response.audio.done
        sequence_number:
          type: integer
          description: |
            The sequence number of the delta.
      required:
        - type
        - sequence_number
        - response_id
    ResponseAudioTranscriptDeltaEvent:
      type: object
      description: Emitted when there is a partial transcript of audio.
      properties:
        type:
          type: string
          description: |
            The type of the event. Always `response.audio.transcript.delta`.
          const: response.audio.transcript.delta
        delta:
          type: string
          description: |
            The partial transcript of the audio response.
        sequence_number:
          type: integer
          description: The sequence number of this event.
      required:
        - type
        - response_id
        - delta
        - sequence_number
    ResponseAudioTranscriptDoneEvent:
      type: object
      description: Emitted when the full audio transcript is completed.
      properties:
        type:
          type: string
          description: |
            The type of the event. Always `response.audio.transcript.done`.
          const: response.audio.transcript.done
        sequence_number:
          type: integer
          description: The sequence number of this event.
      required:
        - type
        - response_id
        - sequence_number
    ResponseCodeInterpreterCallCodeDeltaEvent:
      type: object
      description: Emitted when a partial code snippet is streamed by the code interpreter.
      properties:
        type:
          type: string
          description: The type of the event. Always `response.code_interpreter_call_code.delta`.
          const: response.code_interpreter_call_code.delta
        output_index:
          type: integer
          description: The index of the output item in the response for which the code is being streamed.
        item_id:
          type: string
          description: The unique identifier of the code interpreter tool call item.
        delta:
          type: string
          description: The partial code snippet being streamed by the code interpreter.
        sequence_number:
          type: integer
          description: The sequence number of this event, used to order streaming events.
      required:
        - type
        - output_index
        - item_id
        - delta
        - sequence_number
    ResponseCodeInterpreterCallCodeDoneEvent:
      type: object
      description: Emitted when the code snippet is finalized by the code interpreter.
      properties:
        type:
          type: string
          description: The type of the event. Always `response.code_interpreter_call_code.done`.
          const: response.code_interpreter_call_code.done
        output_index:
          type: integer
          description: The index of the output item in the response for which the code is finalized.
        item_id:
          type: string
          description: The unique identifier of the code interpreter tool call item.
        code:
          type: string
          description: The final code snippet output by the code interpreter.
        sequence_number:
          type: integer
          description: The sequence number of this event, used to order streaming events.
      required:
        - type
        - output_index
        - item_id
        - code
        - sequence_number
    ResponseCodeInterpreterCallCompletedEvent:
      type: object
      description: Emitted when the code interpreter call is completed.
      properties:
        type:
          type: string
          description: The type of the event. Always `response.code_interpreter_call.completed`.
          const: response.code_interpreter_call.completed
        output_index:
          type: integer
          description: The index of the output item in the response for which the code interpreter call is completed.
        item_id:
          type: string
          description: The unique identifier of the code interpreter tool call item.
        sequence_number:
          type: integer
          description: The sequence number of this event, used to order streaming events.
      required:
        - type
        - output_index
        - item_id
        - sequence_number
    ResponseCodeInterpreterCallInProgressEvent:
      type: object
      description: Emitted when a code interpreter call is in progress.
      properties:
        type:
          type: string
          description: The type of the event. Always `response.code_interpreter_call.in_progress`.
          const: response.code_interpreter_call.in_progress
        output_index:
          type: integer
          description: The index of the output item in the response for which the code interpreter call is in progress.
        item_id:
          type: string
          description: The unique identifier of the code interpreter tool call item.
        sequence_number:
          type: integer
          description: The sequence number of this event, used to order streaming events.
      required:
        - type
        - output_index
        - item_id
        - sequence_number
    ResponseCodeInterpreterCallInterpretingEvent:
      type: object
      description: Emitted when the code interpreter is actively interpreting the code snippet.
      properties:
        type:
