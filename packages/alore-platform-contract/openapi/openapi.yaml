              $ref: "#/components/schemas/ResponsePromptCacheOptionsParam"
            service_tier:
              $ref: "#/components/schemas/ServiceTierResponses"
            truncation:
              deprecated: true
              anyOf:
                - type: string
                  description: |
                    The truncation strategy to use for the model response.
                    - `auto`: If the input to this Response exceeds
                      the model's context window size, the model will truncate the
                      response to fit the context window by dropping items from the beginning of the conversation.
                      On some models, trimming can begin earlier because the API subtracts the model's
                      maximum output allowance from its input limit, even if you set a lower `max_output_tokens`.
                    - `disabled` (default): If the input size will exceed the context window
                      size for a model, the request will fail with a 400 error.
                  enum:
                    - auto
                    - disabled
                  default: disabled
                - type: "null"
            reasoning:
              anyOf:
                - $ref: "#/components/schemas/Reasoning"
                - type: "null"
            input:
              $ref: "#/components/schemas/InputParam"
            include:
              anyOf:
                - type: array
                  description: |-
                    Specify additional output data to include in the model response. Currently supported values are:
                    - `web_search_call.action.sources`: Include the sources of the web search tool call.
                    - `code_interpreter_call.outputs`: Includes the outputs of python code execution in code interpreter tool call items.
                    - `computer_call_output.output.image_url`: Include image urls from the computer call output.
                    - `file_search_call.results`: Include the search results of the file search tool call.
                    - `message.input_image.image_url`: Include image urls from the input message.
                    - `message.output_text.logprobs`: Include logprobs with assistant messages.
                    - `reasoning.encrypted_content`: Includes an encrypted version of reasoning tokens in reasoning item outputs. This enables reasoning items to be used in multi-turn conversations when using the Responses API statelessly (like when the `store` parameter is set to `false`, or when an organization is enrolled in the zero data retention program).
                  items:
                    $ref: "#/components/schemas/IncludeEnum"
                - type: "null"
            parallel_tool_calls:
              anyOf:
                - type: boolean
                  description: |
                    Whether to allow the model to run tool calls in parallel.
                  default: true
                - type: "null"
            store:
              anyOf:
                - type: boolean
                  description: |
                    Whether to store the generated model response for later retrieval via
                    API.
                    Defaults to true when omitted.
                    If set to true, response data will be stored for at least 30 days, subject to the [data retention exceptions](https://developers.openai.com/api/docs/guides/your-data#v1responses).
                  default: true
                - type: "null"
            instructions:
              anyOf:
                - type: string
                  description: |
                    A system (or developer) message inserted into the model's context.

                    When using along with `previous_response_id`, the instructions from a previous
                    response will not be carried over to the next response. This makes it simple
                    to swap out system (or developer) messages in new responses.
                - type: "null"
            moderation:
              anyOf:
                - $ref: "#/components/schemas/ModerationParam"
                  description: |
                    Configuration for running moderation on the input and output of this response.
                - type: "null"
            background_options:
              $ref: "#/components/schemas/BackgroundOptionsParam"
              description: |
                Options for background execution on HTTP requests. The `2h` and `8h`
                completion windows require `background: true`, Standard processing,
                and `stream: false` or omitted.
            stream:
              anyOf:
                - description: |
                    If set to true, the model response data will be streamed to the client
                    as it is generated using [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format).
                    See the [Streaming section below](https://developers.openai.com/api/reference/resources/responses/streaming-events)
                    for more information.
                  type: boolean
                  default: false
                - type: "null"
            stream_options:
              $ref: "#/components/schemas/ResponseStreamOptions"
            conversation:
              anyOf:
                - $ref: "#/components/schemas/ConversationParam"
                - type: "null"
            context_management:
              anyOf:
                - type: array
                  example:
                    - type: compaction
