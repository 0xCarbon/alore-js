              format: unixtime
            - type: "null"
        last_active_at:
          anyOf:
            - description: The Unix timestamp (in seconds) for when the vector store was last active.
              type: integer
              format: unixtime
            - type: "null"
        metadata:
          $ref: "#/components/schemas/Metadata"
      required:
        - id
