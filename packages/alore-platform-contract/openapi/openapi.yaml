    ModelResponseProperties:
      type: object
      properties:
        metadata:
          $ref: "#/components/schemas/Metadata"
        top_logprobs:
          anyOf:
            - description: |
                An integer between 0 and 20 specifying the maximum number of most likely
                tokens to return at each token position, each with an associated log
                probability. In some cases, the number of returned tokens may be fewer than
                requested.
              type: integer
              minimum: 0
              maximum: 20
            - type: "null"
        temperature:
          anyOf:
            - type: number
              minimum: 0
              maximum: 2
              default: 1
              example: 1
              description: |
                What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
                We generally recommend altering this or `top_p` but not both.
            - type: "null"
        top_p:
          anyOf:
            - type: number
              minimum: 0
              maximum: 1
              default: 1
              example: 1
              description: |
                An alternative to sampling with temperature, called nucleus sampling,
                where the model considers the results of the tokens with top_p probability
                mass. So 0.1 means only the tokens comprising the top 10% probability mass
                are considered.

                We generally recommend altering this or `temperature` but not both.
            - type: "null"
        user:
          type:
            - string
            - "null"
          example: user-1234
          deprecated: true
          description: |
            This field is being replaced by `safety_identifier` and `prompt_cache_key`. Use `prompt_cache_key` instead to maintain caching optimizations.
            A stable identifier for your end-users.
            Used to boost cache hit rates by better bucketing similar requests and  to help OpenAI detect and prevent abuse. [Learn more](https://developers.openai.com/api/docs/guides/safety-best-practices#implement-safety-identifiers).
        safety_identifier:
          anyOf:
            - type: string
              maxLength: 128
              example: safety-identifier-1234
              description: |
                A stable identifier used to help detect users of your application that may be violating OpenAI's usage policies.
                The IDs should be a string that uniquely identifies each user, with a maximum length of 128 characters. We recommend hashing their username or email address, in order to avoid sending us any identifying information. [Learn more](https://developers.openai.com/api/docs/guides/safety-best-practices#implement-safety-identifiers).
            - type: "null"
        prompt_cache_key:
          anyOf:
            - type: string
              example: prompt-cache-key-1234
              description: |
                Used by OpenAI to cache responses for similar requests to optimize your cache hit rates. Replaces the `user` field. [Learn more](https://developers.openai.com/api/docs/guides/prompt-caching).
            - type: "null"
        prompt_cache_retention:
          deprecated: true
          anyOf:
            - type: string
              enum:
                - in_memory
                - 24h
              description: |
                Deprecated. Use `prompt_cache_options.ttl` instead.

                The retention policy for the prompt cache. Set to `24h` to enable extended prompt caching, which keeps cached prefixes active for longer, up to a maximum of 24 hours. [Learn more](https://developers.openai.com/api/docs/guides/prompt-caching#prompt-cache-retention).
                This field expresses a maximum retention policy, while
                `prompt_cache_options.ttl` expresses a minimum cache lifetime. The two
                fields are independent and do not interact.
                For `gpt-5.5`, `gpt-5.5-pro`, and future models, only `24h` is supported.

                For older models that support both `in_memory` and `24h`, the default depends on your organization's data retention policy:
                  - Organizations without ZDR enabled default to `24h`.
                  - Organizations with ZDR enabled default to `in_memory` when `prompt_cache_retention` is not specified.
            - type: "null"
    ModifyAssistantRequest:
      type: object
      additionalProperties: false
      properties:
        model:
          description: |
            ID of the model to use. You can use the [List models](https://developers.openai.com/api/reference/resources/models/methods/list) API to see all of your available models, or see our [Model overview](https://developers.openai.com/api/docs/models) for descriptions of them.
          anyOf:
            - type: string
            - $ref: "#/components/schemas/AssistantSupportedModels"
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        name:
          anyOf:
            - description: |
                The name of the assistant. The maximum length is 256 characters.
              type: string
              maxLength: 256
            - type: "null"
        description:
          anyOf:
            - description: |
                The description of the assistant. The maximum length is 512 characters.
              type: string
              maxLength: 512
            - type: "null"
        instructions:
          anyOf:
            - description: |
                The system instructions that the assistant uses. The maximum length is 256,000 characters.
              type: string
              maxLength: 256000
            - type: "null"
        tools:
          description: |
            A list of tool enabled on the assistant. There can be a maximum of 128 tools per assistant. Tools can be of types `code_interpreter`, `file_search`, or `function`.
          default: []
          type: array
          maxItems: 128
          items:
            oneOf:
              - $ref: "#/components/schemas/AssistantToolsCode"
              - $ref: "#/components/schemas/AssistantToolsFileSearch"
              - $ref: "#/components/schemas/AssistantToolsFunction"
        tool_resources:
          anyOf:
            - type: object
              description: |
                A set of resources that are used by the assistant's tools. The resources are specific to the type of tool. For example, the `code_interpreter` tool requires a list of file IDs, while the `file_search` tool requires a list of vector store IDs.
              properties:
                code_interpreter:
                  type: object
                  properties:
                    file_ids:
                      type: array
                      description: |
                        Overrides the list of [file](https://developers.openai.com/api/reference/resources/files) IDs made available to the `code_interpreter` tool. There can be a maximum of 20 files associated with the tool.
                      default: []
                      maxItems: 20
                      items:
                        type: string
                file_search:
                  type: object
                  properties:
                    vector_store_ids:
                      type: array
                      description: |
                        Overrides the [vector store](https://developers.openai.com/api/reference/resources/vector_stores) attached to this assistant. There can be a maximum of 1 vector store attached to the assistant.
                      maxItems: 1
                      items:
                        type: string
            - type: "null"
        metadata:
          $ref: "#/components/schemas/Metadata"
        temperature:
          anyOf:
            - description: |
                What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
              type: number
              minimum: 0
              maximum: 2
              default: 1
              example: 1
            - type: "null"
        top_p:
          anyOf:
            - type: number
              minimum: 0
              maximum: 1
              default: 1
              example: 1
              description: |
                An alternative to sampling with temperature, called nucleus sampling, where the model considers the results of the tokens with top_p probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered.

                We generally recommend altering this or temperature but not both.
            - type: "null"
        response_format:
          anyOf:
            - $ref: "#/components/schemas/AssistantsApiResponseFormatOption"
            - type: "null"
