# Generated by scripts/generate.mjs from the pinned cut, x-alore overlay and standard problem responses.
# Never edit by hand: change the overlay, the schemas or the routes, then run generate.
openapi: 3.1.0
info:
  title: Alore AI API
  description: "The OpenAI-compatible Alore AI API under /ai/v1: the pinned upstream OpenAI spec cut to the routes Alore serves, plus x-alore extensions. Every operation carries x-status."
  version: 0.1.0-alpha.1
  contact:
    name: Alore Support
    email: support@bealore.com
    url: https://bealore.com
servers:
  - url: /ai/v1
    description: Alore AI API. Paths in this document are relative to this base.
security:
  - ApiKeyAuth: []
tags:
  - name: Assistants
    description: Build Assistants that can call models and use tools.
  - name: Audio
    description: Turn audio into text or text into audio.
  - name: Chat
    description: Given a list of messages comprising a conversation, the model will return a response.
  - name: Conversations
    description: Manage conversations and conversation items.
  - name: Embeddings
    description: Get a vector representation of a given input that can be easily consumed by machine learning models and algorithms.
  - name: Batch
    description: Create large batches of API requests to run asynchronously.
  - name: Files
    description: Files are used to upload documents that can be used with features like Assistants and Fine-tuning.
  - name: Uploads
    description: Use Uploads to upload large files in multiple parts.
  - name: Images
    description: Given a prompt and/or an input image, the model will generate a new image.
  - name: Models
    description: List and describe the various models available in the API.
  - name: Responses
    description: Create and manage model responses.
  - name: x-alore
    description: Alore extension routes. Added only where the pinned upstream spec has no equivalent.
paths:
  /audio/speech:
    post:
      operationId: createSpeech
      tags:
        - Audio
      summary: Create speech
      description: |
        Generates audio from the input text.

        Returns the audio file content, or a stream of audio events.

        The `tts-1`, `tts-1-hd`, `gpt-4o-mini-tts`, `gpt-4o-mini-tts-2025-03-20`, and
        `gpt-4o-mini-tts-2025-12-15` models are deprecated and scheduled to shut down
        on January 6, 2027. These examples use the existing Speech API; for new
        integrations, migrate to `gpt-realtime-2.1-mini` through the
        [Realtime API](https://developers.openai.com/api/docs/guides/realtime). See the
        [deprecation schedule](https://developers.openai.com/api/docs/deprecations) for migration details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpeechRequest"
      responses:
        "200":
          description: OK
          headers:
            Transfer-Encoding:
              schema:
                type: string
              description: chunked
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/aac:
              schema:
                type: string
                format: binary
            audio/opus:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
            audio/pcm:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            text/event-stream:
              schema:
                $ref: "#/components/schemas/CreateSpeechResponseStreamEvent"
        "400":
          description: Invalid speech request, input, output format, or voice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AloreProblem"
        "401":
          description: Authentication failed because the API key is missing or revoked, or the client IP is not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            text/plain:
              schema:
                type: string
                description: JSON-encoded error text containing an error object and the HTTP status.
            application/problem+json:
              schema:
                $ref: "#/components/schemas/AloreProblem"
        "403":
