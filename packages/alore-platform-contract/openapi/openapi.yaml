            - type: "null"
        instructions:
          anyOf:
            - description: |
                The system instructions that the assistant uses. The maximum length is 256,000 characters.
              type: string
              maxLength: 256000
            - type: "null"
        reasoning_effort:
          $ref: "#/components/schemas/ReasoningEffort"
        tools:
          description: |
            A list of tool enabled on the assistant. There can be a maximum of 128 tools per assistant. Tools can be of types `code_interpreter`, `file_search`, or `function`.
          default: []
          type: array
          maxItems: 128
          items:
            oneOf:
              - $ref: "#/components/schemas/AssistantToolsCode"
              - $ref: "#/components/schemas/AssistantToolsFileSearch"
              - $ref: "#/components/schemas/AssistantToolsFunction"
        tool_resources:
          anyOf:
            - type: object
              description: |
                A set of resources that are used by the assistant's tools. The resources are specific to the type of tool. For example, the `code_interpreter` tool requires a list of file IDs, while the `file_search` tool requires a list of vector store IDs.
              properties:
                code_interpreter:
                  type: object
                  properties:
                    file_ids:
                      type: array
                      description: |
                        A list of [file](https://developers.openai.com/api/reference/resources/files) IDs made available to the `code_interpreter` tool. There can be a maximum of 20 files associated with the tool.
                      default: []
                      maxItems: 20
                      items:
                        type: string
                file_search:
                  type: object
                  properties:
                    vector_store_ids:
                      type: array
                      description: |
                        The [vector store](https://developers.openai.com/api/reference/resources/vector_stores) attached to this assistant. There can be a maximum of 1 vector store attached to the assistant.
                      maxItems: 1
                      items:
                        type: string
                    vector_stores:
                      type: array
                      description: |
                        A helper to create a [vector store](https://developers.openai.com/api/reference/resources/vector_stores) with file_ids and attach it to this assistant. There can be a maximum of 1 vector store attached to the assistant.
                      maxItems: 1
                      items:
                        type: object
                        properties:
                          file_ids:
                            type: array
                            description: |
                              A list of [file](https://developers.openai.com/api/reference/resources/files) IDs to add to the vector store. For vector stores created before Nov 2025, there can be a maximum of 10,000 files in a vector store. For vector stores created starting in Nov 2025, the limit is 100,000,000 files.
                            maxItems: 100000000
                            items:
                              type: string
                          chunking_strategy:
                            type: object
                            description: The chunking strategy used to chunk the file(s). If not set, will use the `auto` strategy.
                            oneOf:
                              - type: object
                                title: Auto Chunking Strategy
                                description: The default strategy. This strategy currently uses a `max_chunk_size_tokens` of `800` and `chunk_overlap_tokens` of `400`.
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    description: Always `auto`.
                                    enum:
                                      - auto
                                    x-stainless-const: true
                                required:
                                  - type
                              - type: object
                                title: Static Chunking Strategy
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    description: Always `static`.
                                    enum:
                                      - static
                                    x-stainless-const: true
                                  static:
                                    type: object
                                    additionalProperties: false
                                    properties:
                                      max_chunk_size_tokens:
                                        type: integer
                                        minimum: 100
                                        maximum: 4096
                                        description: The maximum number of tokens in each chunk. The default value is `800`. The minimum value is `100` and the maximum value is `4096`.
                                      chunk_overlap_tokens:
                                        type: integer
                                        description: |
                                          The number of tokens that overlap between chunks. The default value is `400`.

                                          Note that the overlap must not exceed half of `max_chunk_size_tokens`.
                                    required:
                                      - max_chunk_size_tokens
                                      - chunk_overlap_tokens
                                required:
                                  - type
                                  - static
                          metadata:
                            $ref: "#/components/schemas/Metadata"
                  oneOf:
                    - required:
                        - vector_store_ids
                    - required:
                        - vector_stores
            - type: "null"
        metadata:
          $ref: "#/components/schemas/Metadata"
        temperature:
          anyOf:
            - description: |
                What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
              type: number
              minimum: 0
              maximum: 2
              default: 1
              example: 1
            - type: "null"
        top_p:
          anyOf:
            - type: number
              minimum: 0
              maximum: 1
              default: 1
              example: 1
              description: |
                An alternative to sampling with temperature, called nucleus sampling, where the model considers the results of the tokens with top_p probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered.

                We generally recommend altering this or temperature but not both.
            - type: "null"
        response_format:
          anyOf:
            - $ref: "#/components/schemas/AssistantsApiResponseFormatOption"
            - type: "null"
      required:
        - model
    CreateBatchRequest:
      type: object
      required:
        - input_file_id
        - endpoint
        - completion_window
      properties:
        input_file_id:
          type: string
          description: |
            The ID of an uploaded file that contains requests for the new batch.

            See [upload file](https://developers.openai.com/api/reference/resources/files/methods/create) for how to upload a file.

            Your input file must be formatted as a [JSONL file](https://developers.openai.com/api/docs/guides/batch#1-prepare-your-batch-file), and must be uploaded with the purpose `batch`. The file can contain up to 50,000 requests, and can be up to 200 MB in size.
        endpoint:
          type: string
          enum:
            - /v1/responses
            - /v1/chat/completions
            - /v1/embeddings
            - /v1/completions
            - /v1/moderations
            - /v1/images/generations
            - /v1/images/edits
            - /v1/videos
          x-openai-enum-deprecations:
            /v1/videos:
              message: The Videos API shut down on September 24, 2026. Batch creation no longer accepts this endpoint.
          description: The endpoint to be used for all requests in the batch. Currently `/v1/responses`, `/v1/chat/completions`, `/v1/embeddings`, `/v1/completions`, `/v1/moderations`, `/v1/images/generations`, and `/v1/images/edits` are supported. Note that `/v1/embeddings` batches are also restricted to a maximum of 50,000 embedding inputs across all requests in the batch.
        completion_window:
          type: string
          enum:
            - 24h
          description: The time frame within which the batch should be processed. Currently only `24h` is supported.
        metadata:
          $ref: "#/components/schemas/Metadata"
        output_expires_after:
          $ref: "#/components/schemas/BatchFileExpirationAfter"
    CreateChatCompletionRequest:
      allOf:
        - $ref: "#/components/schemas/CreateModelResponseProperties"
        - type: object
          properties:
            prompt_cache_options:
              $ref: "#/components/schemas/PromptCacheOptionsParam"
            messages:
              description: |
                A list of messages comprising the conversation so far. Depending on the
                [model](https://developers.openai.com/api/docs/models) you use, different message types (modalities) are
                supported, like [text](https://developers.openai.com/api/docs/guides/text),
                [images](https://developers.openai.com/api/docs/guides/images-vision), and [audio](https://developers.openai.com/api/docs/guides/audio).
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/ChatCompletionRequestMessage"
            model:
              description: |
                Model ID used to generate the response, like `gpt-6.2-astra`. OpenAI
                offers a wide range of models with different capabilities, performance
                characteristics, and price points. Refer to the [model guide](https://developers.openai.com/api/docs/models)
                to browse and compare available models.
              $ref: "#/components/schemas/ModelIdsShared"
            service_tier:
              $ref: "#/components/schemas/ServiceTier"
            modalities:
              $ref: "#/components/schemas/ResponseModalities"
            verbosity:
              $ref: "#/components/schemas/Verbosity"
            reasoning_effort:
              $ref: "#/components/schemas/ReasoningEffort"
            max_completion_tokens:
              description: |
                An upper bound for the number of tokens that can be generated for a completion, including visible output tokens and [reasoning tokens](https://developers.openai.com/api/docs/guides/reasoning).
              type:
                - integer
                - "null"
            frequency_penalty:
              type:
                - number
                - "null"
              default: 0
              minimum: -2
              maximum: 2
              description: |
                Number between -2.0 and 2.0. Positive values penalize new tokens based on
                their existing frequency in the text so far, decreasing the model's
                likelihood to repeat the same line verbatim.
            presence_penalty:
              type:
                - number
                - "null"
              default: 0
              minimum: -2
              maximum: 2
              description: |
                Number between -2.0 and 2.0. Positive values penalize new tokens based on
                whether they appear in the text so far, increasing the model's likelihood
                to talk about new topics.
            web_search_options:
              type: object
              title: Web search
              description: |
                This tool searches the web for relevant results to use in a response.
                Learn more about the [web search tool](https://developers.openai.com/api/docs/guides/tools-web-search).
              properties:
                user_location:
                  type:
                    - object
                    - "null"
                  required:
                    - type
                    - approximate
                  description: |
                    Approximate location parameters for the search.
                  properties:
                    type:
                      type: string
                      description: |
                        The type of location approximation. Always `approximate`.
                      const: approximate
                    approximate:
                      $ref: "#/components/schemas/WebSearchLocation"
                search_context_size:
                  $ref: "#/components/schemas/WebSearchContextSize"
            top_logprobs:
              description: |
                An integer between 0 and 20 specifying the maximum number of most likely
                tokens to return at each token position, each with an associated log
                probability. In some cases, the number of returned tokens may be fewer than
                requested.
                `logprobs` must be set to `true` if this parameter is used.
              type:
                - integer
                - "null"
              minimum: 0
              maximum: 20
            response_format:
              description: |
                An object specifying the format that the model must output.

                Setting to `{ "type": "json_schema", "json_schema": {...} }` enables
                Structured Outputs which ensures the model will match your supplied JSON
                schema. Learn more in the [Structured Outputs
                guide](https://developers.openai.com/api/docs/guides/structured-outputs).

                Setting to `{ "type": "json_object" }` enables the older JSON mode, which
                ensures the message the model generates is valid JSON. Using `json_schema`
                is preferred for models that support it.
              oneOf:
                - $ref: "#/components/schemas/ResponseFormatText"
                - $ref: "#/components/schemas/ResponseFormatJsonSchema"
                - $ref: "#/components/schemas/ResponseFormatJsonObject"
              discriminator:
                propertyName: type
            audio:
              type:
                - object
                - "null"
              description: |
                Parameters for audio output. Required when audio output is requested with
                `modalities: ["audio"]`. [Learn more](https://developers.openai.com/api/docs/guides/audio).
              required:
                - voice
                - format
              properties:
                voice:
                  $ref: "#/components/schemas/VoiceIdsOrCustomVoice"
                  description: |
                    The voice the model uses to respond. Supported built-in voices are
                    `alloy`, `ash`, `ballad`, `coral`, `echo`, `fable`, `nova`, `onyx`,
                    `sage`, `shimmer`, `marin`, and `cedar`. You may also provide a
                    custom voice object with an `id`, for example `{ "id": "voice_1234" }`.
                    Custom voices must be created from audio samples. Voices created from text
                    prompts are supported only in Live.
                format:
                  type: string
                  enum:
                    - wav
                    - aac
                    - mp3
                    - flac
                    - opus
                    - pcm16
                  description: |
                    Specifies the output audio format. Must be one of `wav`, `mp3`, `flac`,
                    `opus`, or `pcm16`.
            store:
              type:
                - boolean
                - "null"
              default: false
              description: |
                Whether or not to store the output of this chat completion request for
                use in our [model distillation](https://developers.openai.com/api/docs/guides/supervised-fine-tuning#distilling-from-a-larger-model) or
                [evals](https://developers.openai.com/api/docs/guides/evals) products.

                Supports text and image inputs. Note: image inputs over 8MB will be dropped.
            moderation:
              anyOf:
                - $ref: "#/components/schemas/ModerationParam"
                  description: |
                    Configuration for running moderation on the request input and generated output.
                - type: "null"
            stream:
              description: |
                If set to true, the model response data will be streamed to the client
                as it is generated using [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format).
                See the [Streaming section below](https://developers.openai.com/api/reference/resources/chat/subresources/completions/streaming-events)
                for more information, along with the [streaming responses](https://developers.openai.com/api/docs/guides/streaming-responses)
                guide for more information on how to handle the streaming events.
              type:
                - boolean
                - "null"
              default: false
            stop:
              $ref: "#/components/schemas/StopConfiguration"
            logit_bias:
              type:
                - object
                - "null"
              x-oaiTypeLabel: map
              default: null
              additionalProperties:
                type: integer
              description: |
                Modify the likelihood of specified tokens appearing in the completion.

                Accepts a JSON object that maps tokens (specified by their token ID in the
                tokenizer) to an associated bias value from -100 to 100. Mathematically,
                the bias is added to the logits generated by the model prior to sampling.
                The exact effect will vary per model, but values between -1 and 1 should
                decrease or increase likelihood of selection; values like -100 or 100
                should result in a ban or exclusive selection of the relevant token.
            logprobs:
              description: |
                Whether to return log probabilities of the output tokens or not. If true,
                returns the log probabilities of each output token returned in the
                `content` of `message`.
              type:
                - boolean
                - "null"
              default: false
            max_tokens:
              description: |
                The maximum number of [tokens](https://platform.openai.com/tokenizer) that can be generated in the
                chat completion. This value can be used to control
                [costs](https://openai.com/api/pricing/) for text generated via API.

                This value is now deprecated in favor of `max_completion_tokens`, and is
                not compatible with [o-series models](https://developers.openai.com/api/docs/guides/reasoning).
              type:
                - integer
                - "null"
              deprecated: true
            n:
              type:
                - integer
                - "null"
              minimum: 1
              maximum: 128
              default: 1
              example: 1
              description: How many chat completion choices to generate for each input message. Omit `n` to generate one choice. Newer models reject an explicit `n`, even `n=1`. When requesting multiple choices, you are billed for generated tokens across all choices.
            prediction:
              description: |
                Configuration for a [Predicted Output](https://developers.openai.com/api/docs/guides/predicted-outputs),
                which can greatly improve response times when large parts of the model
                response are known ahead of time. This is most common when you are
                regenerating a file with only minor changes to most of the content.
              anyOf:
                - $ref: "#/components/schemas/PredictionContent"
                - type: "null"
            seed:
              type:
                - integer
                - "null"
              format: int64
              minimum: -9223372036854776000
              maximum: 9223372036854776000
              deprecated: true
              description: |
                This feature is in Beta.
                If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same `seed` and parameters should return the same result.
                Determinism is not guaranteed, and you should refer to the `system_fingerprint` response parameter to monitor changes in the backend.
            stream_options:
              $ref: "#/components/schemas/ChatCompletionStreamOptions"
            tools:
              type: array
              description: |
                A list of tools the model may call. You can provide either
                [custom tools](https://developers.openai.com/api/docs/guides/function-calling#custom-tools) or
                [function tools](https://developers.openai.com/api/docs/guides/function-calling).
              items:
                oneOf:
                  - $ref: "#/components/schemas/ChatCompletionTool"
                  - $ref: "#/components/schemas/CustomToolChatCompletions"
            tool_choice:
              $ref: "#/components/schemas/ChatCompletionToolChoiceOption"
            parallel_tool_calls:
              $ref: "#/components/schemas/ParallelToolCalls"
            function_call:
              deprecated: true
              description: |
                Deprecated in favor of `tool_choice`.

                Controls which (if any) function is called by the model.

                `none` means the model will not call a function and instead generates a
                message.

                `auto` means the model can pick between generating a message or calling a
                function.

                Specifying a particular function via `{"name": "my_function"}` forces the
                model to call that function.

                `none` is the default when no functions are present. `auto` is the default
                if functions are present.
              oneOf:
                - type: string
                  description: |
                    `none` means the model will not call a function and instead generates a message. `auto` means the model can pick between generating a message or calling a function.
                  enum:
                    - none
                    - auto
                - $ref: "#/components/schemas/ChatCompletionFunctionCallOption"
            functions:
              deprecated: true
              description: |
                Deprecated in favor of `tools`.

                A list of functions the model may generate JSON inputs for.
              type: array
              minItems: 1
              maxItems: 128
              items:
                $ref: "#/components/schemas/ChatCompletionFunctions"
          required:
            - model
            - messages
    CreateChatCompletionResponse:
      type: object
      description: Represents a chat completion response returned by model, based on the provided input.
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion.
        choices:
          type: array
          description: A list of chat completion choices. Can be more than one if `n` is greater than 1.
          items:
            type: object
            required:
              - finish_reason
              - index
              - message
              - logprobs
            properties:
              finish_reason:
                type: string
                description: |
                  The reason the model stopped generating tokens. This will be `stop` if the model hit a natural stop point or a provided stop sequence,
                  `length` if the maximum number of tokens specified in the request was reached,
                  `content_filter` if content was omitted due to a flag from our content filters,
                  `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called a function.
                  Read the [Model Spec](https://model-spec.openai.com/2025-12-18.html) for more.
                enum:
                  - stop
                  - length
                  - tool_calls
                  - content_filter
                  - function_call
              index:
                type: integer
                description: The index of the choice in the list of choices.
              message:
                $ref: "#/components/schemas/ChatCompletionResponseMessage"
              logprobs:
                anyOf:
                  - description: Log probability information for the choice.
                    type: object
                    properties:
                      content:
                        anyOf:
                          - description: A list of message content tokens with log probability information.
                            type: array
                            items:
                              $ref: "#/components/schemas/ChatCompletionTokenLogprob"
                          - type: "null"
                      refusal:
                        anyOf:
                          - description: A list of message refusal tokens with log probability information.
                            type: array
                            items:
                              $ref: "#/components/schemas/ChatCompletionTokenLogprob"
                          - type: "null"
                    required:
                      - content
                      - refusal
                  - type: "null"
        created:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) of when the chat completion was created.
        model:
          type: string
          description: The model used for the chat completion.
        metadata:
          $ref: "#/components/schemas/Metadata"
        service_tier:
          $ref: "#/components/schemas/ServiceTier"
        system_fingerprint:
          type: string
          deprecated: true
          description: |
            This fingerprint represents the backend configuration that the model runs with.

            Can be used in conjunction with the `seed` request parameter to understand when backend changes have been made that might impact determinism.
        object:
          type: string
          description: The object type, which is always `chat.completion`.
          const: chat.completion
        usage:
          $ref: "#/components/schemas/CompletionUsage"
        moderation:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionModeration"
              description: |
                Moderation results for the request input and generated output, if moderated
                completions were requested.
            - type: "null"
      required:
        - choices
        - created
        - id
        - model
        - object
    CreateChatCompletionStreamResponse:
      type: object
      description: |
        Represents a streamed chunk of a chat completion response returned
        by the model, based on the provided input.
        [Learn more](https://developers.openai.com/api/docs/guides/streaming-responses).
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion. Each chunk has the same ID.
        choices:
          type: array
          description: |
            A list of chat completion choices. Can contain more than one elements if `n` is greater than 1. Can also be empty for the
            last chunk if you set `stream_options: {"include_usage": true}`.
          items:
            type: object
            required:
              - delta
              - index
            properties:
              delta:
                $ref: "#/components/schemas/ChatCompletionStreamResponseDelta"
              logprobs:
                description: Log probability information for the choice.
                type:
                  - object
                  - "null"
                properties:
                  content:
                    description: A list of message content tokens with log probability information.
                    type:
                      - array
                      - "null"
                    items:
                      $ref: "#/components/schemas/ChatCompletionTokenLogprob"
                  refusal:
                    description: A list of message refusal tokens with log probability information.
                    type:
                      - array
                      - "null"
                    items:
                      $ref: "#/components/schemas/ChatCompletionTokenLogprob"
                required:
                  - content
                  - refusal
              finish_reason:
                type:
                  - string
                  - "null"
                description: |
                  The reason the model stopped generating tokens. This will be `stop` if the model hit a natural stop point or a provided stop sequence,
                  `length` if the maximum number of tokens specified in the request was reached,
                  `content_filter` if content was omitted due to a flag from our content filters,
                  `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called a function.
                  Omitted from the final audio update containing only `delta.audio.expires_at`.
                enum:
                  - stop
                  - length
                  - tool_calls
                  - content_filter
                  - function_call
                  - null
              index:
                type: integer
                description: The index of the choice in the list of choices.
        created:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) of when the chat completion was created. Each chunk has the same timestamp.
        model:
          type: string
          description: The model to generate the completion.
        obfuscation:
          type: string
          description: |
            An obfuscation string added to normalize the size of streamed chunks as a
            mitigation to certain side-channel attacks. The field is included by
            default and omitted when `stream_options.include_obfuscation` is `false`.
        service_tier:
          $ref: "#/components/schemas/ServiceTier"
        system_fingerprint:
          type: string
          deprecated: true
          description: |
            This fingerprint represents the backend configuration that the model runs with.
            Can be used in conjunction with the `seed` request parameter to understand when backend changes have been made that might impact determinism.
        object:
          type: string
          description: The object type, which is always `chat.completion.chunk`.
          const: chat.completion.chunk
        usage:
          anyOf:
            - $ref: "#/components/schemas/CompletionUsage"
            - type: "null"
          description: |
            An optional field that will only be present when you set
            `stream_options: {"include_usage": true}` in your request. When present, it
            contains a null value **except for the last chunk** which contains the
            token usage statistics for the entire request.

            **NOTE:** If the stream is interrupted or cancelled, you may not
            receive the final usage chunk which contains the total token usage for
            the request.
        moderation:
          anyOf:
            - $ref: "#/components/schemas/ChatCompletionModeration"
              description: |
                Moderation results for the request input and generated output. Present
                on the moderation chunk when moderated completions are requested.
            - type: "null"
      required:
        - choices
        - created
        - id
        - model
        - object
      examples:
        - id: chatcmpl-123
          object: chat.completion.chunk
          created: 1694268190
          model: gpt-6.2-astra
          system_fingerprint: fp_44709d6fcb
          choices:
            - index: 0
              delta:
                content: Hello
              logprobs: null
              finish_reason: null
          obfuscation: p9K3xT6w
        - id: chatcmpl-123
          object: chat.completion.chunk
          created: 1694268190
          model: gpt-6.2-astra
          system_fingerprint: fp_44709d6fcb
          choices:
            - index: 0
              delta: {}
              logprobs: null
              finish_reason: stop
          obfuscation: ""
    CreateEmbeddingRequest:
      type: object
      additionalProperties: false
      properties:
        input:
          description: |
            Input text to embed, encoded as a string or array of tokens. To embed multiple inputs in a single request, pass an array of strings or array of token arrays. The input must not exceed the max input tokens for the model (8192 tokens for all embedding models), cannot be an empty string, and any array must be 2048 dimensions or less. [Example Python code](https://cookbook.openai.com/examples/how_to_count_tokens_with_tiktoken) for counting tokens. In addition to the per-input token limit, all embedding models enforce a maximum of 300,000 tokens summed across all inputs in a single request.
          example: The quick brown fox jumped over the lazy dog
          oneOf:
            - type: string
              title: string
              description: The string that will be turned into an embedding.
