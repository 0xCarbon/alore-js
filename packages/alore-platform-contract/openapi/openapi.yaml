          description: The size of the generated images. For `gpt-image-2`, `gpt-image-2-2026-04-21`, `gpt-image-2.5-sunburst`, `gpt-image-2.5-sunburst-2026-09-08`, `gpt-image-2.5-flare`, and `gpt-image-2.5-flare-2026-09-08`, arbitrary resolutions are supported as `WIDTHxHEIGHT` strings, for example `1536x864`. Width and height must both be divisible by 16 and the requested aspect ratio must be between 1:3 and 3:1. Resolutions above `2560x1440` are experimental, and the maximum supported resolution is `3840x2160`. The requested size must also satisfy the model's current pixel and edge limits. The standard sizes `1024x1024`, `1536x1024`, and `1024x1536` are supported by the GPT image models; `auto` is supported for models that allow automatic sizing.
          default: auto
        output_format:
          type: string
          enum:
            - png
            - webp
            - jpeg
            - gif
            - svg
          description: |
            The output format of the generated image. One of `png`, `webp`, `jpeg`,
            `gif`, or `svg`. Default: `png`. GIF and SVG output require a model
            that supports the selected format. GIF output does not support
            partial image streaming (`partial_images` greater than `0`),
            `input_image_mask`, or custom `output_compression`.
            Responses lifecycle events can still be streamed for GIF output.
          default: png
        frame_count:
          type: integer
          minimum: 2
          maximum: 16
          default: 9
          description: |
            Number of GIF frames. Requires `output_format` to be `gif`. Default: 9.
        frame_duration_ms:
          type: integer
          minimum: 20
          maximum: 2000
          default: 200
          description: |
            Duration of each GIF frame in milliseconds, rounded to 10 ms.
            Requires `output_format` to be `gif`. Default: 200.
        svg:
          description: |
            SVG author model settings. Requires `output_format` to be `svg`.
            When SVG model selection is enabled, omitting this object uses the
            outer response model. Otherwise, the default SVG author is used and
            explicit model overrides are unavailable.
          $ref: "#/components/schemas/SvgParam"
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Compression level for the output image. Default: 100.
          default: 100
        moderation:
          type: string
          enum:
            - auto
            - low
          description: |
            Moderation level for the generated image. Default: `auto`.
          default: auto
        background:
          type: string
          enum:
            - transparent
            - opaque
            - auto
          description: |
            Set the background of the generated image. One of `transparent`, `opaque`,
            or `auto`. `gpt-image-2.5-sunburst` and `gpt-image-2.5-flare`, including
            their `2026-09-08` snapshots, support `opaque` and `transparent`
            backgrounds. Transparent backgrounds are available for supported GPT Image
            models. For `gpt-image-2` and `gpt-image-2-2026-04-21`, this support is in
            preview. When using `transparent`, set the output format to `png` or `webp`.
            Default: `auto`.
          default: auto
        input_fidelity:
          anyOf:
            - $ref: "#/components/schemas/InputFidelity"
            - type: "null"
        input_image_mask:
          type: object
          description: |
            Optional mask for inpainting. Contains `image_url`
            (string, optional) and `file_id` (string, optional).
          properties:
            image_url:
              type: string
              description: |
                Base64-encoded mask image.
            file_id:
              type: string
              description: |
                File ID for the mask image.
          required: []
          additionalProperties: false
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
          description: |
            Number of partial images to generate in streaming mode, from 0 (default value) to 3.
          default: 0
        action:
          description: |
            Whether to generate a new image or edit an existing image. Default: `auto`.
          $ref: "#/components/schemas/ImageGenActionEnum"
      required:
        - type
    ImageRefParam:
      type: object
      description: |
        Reference an input image by either URL or uploaded file ID.
        Provide exactly one of `image_url` or `file_id`.
      properties:
        image_url:
          type: string
          format: uri
          maxLength: 20971520
          description: A fully qualified URL or base64-encoded data URL.
          example: https://example.com/source-image.png
        file_id:
          type: string
          description: The File API ID of an uploaded image to use as input.
          example: file-abc123
      anyOf:
        - required:
            - image_url
        - required:
            - file_id
      not:
        required:
          - image_url
          - file_id
      additionalProperties: false
    ImagesResponse:
