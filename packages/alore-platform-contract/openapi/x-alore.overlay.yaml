# OpenAPI Overlay 1.0. The overlay only adds: optional fields, enum values on Alore-owned enums,
# x-status marks and new /ai/v1 paths tagged x-alore. See README.md for the rules.
overlay: 1.0.0
info:
  title: x-alore overlay
  version: '1'
actions:
  - target: $.info
    description: Name the document after the API it describes. Document metadata is not an OpenAI-defined field.
    update:
      title: Alore AI API
      description: >-
        The OpenAI-compatible Alore AI API under /ai/v1: the pinned upstream OpenAI spec cut to the routes Alore
        serves, plus x-alore extensions. Every operation carries x-status.
  - target: $.tags
    description: Tag for every path Alore adds to the upstream spec.
    update:
      name: x-alore
      description: Alore extension routes. Added only where the pinned upstream spec has no equivalent.
  - target: $.components
    description: Alore-owned schemas live in schemas/ and are referenced, not copied.
    update:
      schemas:
        AloreProblem:
          $ref: ../schemas/problem.schema.json
        AloreMeta:
          $ref: ../schemas/meta.schema.json
        AloreFileExtension:
          $ref: ../schemas/file-extension.schema.json
      responses:
        AloreProblem:
          description: RFC 9457 problem with the OpenAI-style error object.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AloreProblem'
  - target: $.components.schemas.OpenAIFile.properties
    description: Optional response field, emitted only to clients that negotiate files.status.
    update:
      x_alore:
        $ref: '#/components/schemas/AloreFileExtension'
        x-alore-feature: files.status
        x-status: planned
